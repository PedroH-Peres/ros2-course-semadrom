# Parâmetros do nó cerebro.
# Mude aqui e rode o launch de novo (ou use `ros2 param set /cerebro ...`).
cerebro:
  ros__parameters:
    velocidade_maxima: 1.0   # m/s
    ganho_angular: 2.0       # quanto maior, mais rápido o robô gira
    distancia_atras: 0.5     # m, distância da bola de onde o robô chuta
    gol_alvo: amarelo        # "amarelo" ou "azul"
